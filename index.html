function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function deriveRaw(pw){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 return crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},k,256)}
async function open_(raw){var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
 return new TextDecoder().decode(pt)}
